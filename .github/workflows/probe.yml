name: Veri kaynagi yoklama
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/probe.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: probe-out
          path: probe-out
