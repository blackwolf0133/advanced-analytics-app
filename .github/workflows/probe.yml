name: Veri kaynagi yoklama
on:
  push:
    branches: [probe]
    paths: [tools/probe.mjs, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/probe.mjs
      - name: Ciktiyi probe-data dalina yaz
        run: |
          git config user.name probe-bot && git config user.email probe@users.noreply.github.com
          git checkout --orphan probe-data && git rm -rq --cached . && git add -f probe-out && git commit -qm "yoklama ciktisi" && git push -f origin probe-data
