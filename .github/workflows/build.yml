name: APK
on:
  push:
    branches: [main]
    paths-ignore: [tools/**, .github/workflows/veri.yml, .github/workflows/probe.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK olustur
        run: gradle --no-daemon assembleRelease
      - name: Dosyayi adlandir
        run: cp app/build/outputs/apk/release/app-release.apk AdvancedAnalytics.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AdvancedAnalytics-apk
          path: AdvancedAnalytics.apk
      - name: Surum olarak yayinla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Advanced Analytics ${{ github.run_number }}
          files: AdvancedAnalytics.apk
