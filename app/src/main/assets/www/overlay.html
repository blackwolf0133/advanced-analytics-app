<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Tahmin</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
<style>
  html, body { background: transparent; overflow: hidden; font-size: 12px; user-select: none; -webkit-user-select: none; }
  #mini { background: #101720f2; border: 1px solid var(--line); border-top: 0; border-radius: 0 0 12px 12px; padding: 8px; height: 100%; display: flex; flex-direction: column; gap: 6px; }
  #top { display: flex; align-items: center; gap: 8px; }
  #big { width: 62px; height: 62px; border-radius: 31px; font-size: 30px; border-width: 3px; box-shadow: none; }
  #info { font-size: 11px; line-height: 1.3; } #info b { color: var(--gold); font-size: 14px; }
  .zone { margin: 0; gap: 3px; } .zone .ball { min-width: 21px; height: 21px; font-size: 10px; border-radius: 11px; }
  #status { color: var(--muted); font-size: 10.5px; line-height: 1.25; flex: 1; overflow: hidden; }
  #btns { display: grid; grid-template-columns: 1fr 1fr 30px; gap: 5px; } #btns button { min-height: 32px; padding: 2px 4px; font-size: 12px; border-radius: 8px; }
  body.ball #zones, body.ball #status, body.ball #btns, body.ball #info small { display: none; } body.ball #mini { padding: 5px; }
  #pick { position: fixed; inset: 0; background: #000; display: none; } body.full #pick { display: block; } body.full #mini { display: none; }
  #shot, #cv { position: absolute; left: 0; top: 0; } #cv { touch-action: none; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; background: #101720ee; border-top: 1px solid var(--line); padding: 6px 8px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; }
  #bar.up { bottom: auto; top: 0; border-top: 0; border-bottom: 1px solid var(--line); }
  #bar button { min-height: 36px; padding: 4px 10px; } #bar .st { display: inline-flex; align-items: center; gap: 4px; } #bar .st b { min-width: 20px; text-align: center; font-family: var(--mono); }
  #hint { flex-basis: 100%; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div id="mini">
  <div id="top"><div id="big" class="big unk">—</div><div id="info"></div></div>
  <div id="zones"></div>
  <div id="status"></div>
  <div id="btns"><button id="region">Bölge</button><button id="run" class="primary">Başlat</button><button id="close" title="Kapat">×</button></div>
</div>
<div id="pick">
  <img id="shot" alt=""><canvas id="cv"></canvas>
  <div id="bar">
    <span class="st">Satır <button data-a="r-">−</button><b id="rows"></b><button data-a="r+">+</button></span>
    <span class="st">Sütun <button data-a="c-">−</button><b id="cols"></b><button data-a="c+">+</button></span>
    <span class="st" id="firstbox">İlk kutu <button data-a="f-">−</button><b id="first"></b><button data-a="f+">+</button></span>
    <button data-a="preset" id="preset"></button>
    <button data-a="newest" id="newest"></button>
    <button data-a="test">Dene</button><button data-a="save" class="primary">Kaydet</button><button data-a="cancel">İptal</button><button data-a="flip" title="Çubuğu taşı">⇅</button>
    <span id="hint"></span>
  </div>
</div>
<script src="overlay.bundle.js"></script>
</body>
</html>
